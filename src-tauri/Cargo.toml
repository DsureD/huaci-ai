[package]
name = "huaci-ai"
version = "1.0.0"
description = "轻量级划词翻译工具"
authors = ["huaci-ai"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-ico"] }
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-global-shortcut = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1"
dirs = "5"
# 修复 brotli 的 E0277（StandardAlloc 未实现 Allocator）：
# 上游 alloc-no-stdlib 发布了不兼容的新 major 3.0.0。brotli 这条依赖链里有两个间接依赖
# 把约束放宽到横跨 2.x/3.x，会把 3.0.0 拉进来：
#   - alloc-stdlib 0.2.3：alloc-no-stdlib 约束 >=2.0.4, <4.0.0
#   - brotli-decompressor 5.0.2：alloc-no-stdlib 约束 >=2.0.4, <4
# 而 brotli 本身把 alloc-no-stdlib 锁在 2.x，于是依赖图里同时出现 2.0.4 和 3.0.0，
# 两个版本的 Allocator trait 互不兼容 → 编译失败。
# 解决：把这两个“放宽约束”的源头各锁回上一版（alloc-stdlib 0.2.2、brotli-decompressor 5.0.1，
# 它们对 alloc-no-stdlib 的约束都 <3.0.0），并把 alloc-no-stdlib 钉在 2.0.4，整图统一到 2.0.4。
# default-features=false 只锁版本、不改变 feature 集（由 brotli 自行启用所需 feature）。
alloc-no-stdlib = { version = "=2.0.4", default-features = false }
alloc-stdlib = { version = "=0.2.2", default-features = false }
brotli-decompressor = { version = "=5.0.1", default-features = false }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

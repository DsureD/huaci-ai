name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          $exePath = "src-tauri/target/release/huaci-ai.exe"
          $outputDir = "portable"
          $tempDir = "$outputDir/HuaciAI_Portable"
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $zipFile = "$outputDir/HuaciAI_${version}_x64_Portable.zip"

          if (Test-Path $tempDir) {
            Remove-Item $tempDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null

          Copy-Item $exePath -Destination $tempDir
          Copy-Item "config.example.json" -Destination "$tempDir/config.json"

          @"
          # 划词AI - 便携版使用说明

          ## 快速开始

          1. **启动程序**
             - 直接双击 "huaci-ai.exe"
             - 程序会最小化到系统托盘

          2. **配置 API Key**
             - 右键托盘图标，选择「设置」(或双击托盘图标)
             - 在设置界面填入 API Key、模型等，点击保存
             - 也可手动编辑同目录下的 config.json

          3. **使用翻译**
             - 在任意应用中选中文本
             - 等待 1-2 秒自动弹出翻译

          ## 托盘菜单

          右键托盘图标：
          - 启用/禁用划词监听 (菜单文字随状态变化)
          - 设置 (打开可视化配置界面)
          - 退出程序
          双击托盘图标可直接打开设置

          ## API 配置示例

          OpenAI:
            "base_url": "https://api.openai.com/v1"
            "api_key": "sk-proj-xxx..."
            "model": "gpt-4o-mini"

          DeepSeek:
            "base_url": "https://api.deepseek.com/v1"
            "api_key": "sk-xxx..."
            "model": "deepseek-chat"

          其他兼容 OpenAI 格式的接口同理。

          ## 注意事项

          - 首次运行可能需要安装 WebView2 运行时
          - 请将程序添加到杀毒软件白名单
          - 配置文件为程序同目录下的 config.json，方便备份和迁移
          "@ | Out-File -FilePath "$tempDir/使用说明.txt" -Encoding UTF8

          Compress-Archive -Path "$tempDir/*" -DestinationPath $zipFile -Force

          Write-Host "Portable ZIP created: $zipFile"

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: HuaciAI_${{ github.ref_name }}_x64_Portable
          path: portable/*.zip

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            portable/*.zip
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
